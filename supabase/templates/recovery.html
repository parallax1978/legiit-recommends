<!doctype html>
<html>
  <body style="margin:0;padding:32px 16px;background:#f7f7fb;font-family:Inter,Helvetica,Arial,sans-serif;color:#0f172a;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;margin:0 auto;background:#ffffff;border:1px solid #e5e7eb;border-radius:16px;">
      <tr>
        <td style="padding:32px;">
          <p style="margin:0 0 24px;font-size:16px;font-weight:700;letter-spacing:-0.01em;">Legiit<span style="color:#8a12dc;">Recommends</span></p>
          <h1 style="margin:0 0 12px;font-size:20px;line-height:28px;">Reset your password</h1>
          <p style="margin:0 0 24px;font-size:14px;line-height:22px;color:#64748b;">
            Use the button below to choose a new password. The link can be used once and expires
            after 24 hours.
          </p>
          <p style="margin:0 0 24px;">
            <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password"
               style="display:inline-block;padding:12px 24px;border-radius:9999px;background:#8a12dc;color:#ffffff;font-size:14px;font-weight:600;text-decoration:none;">
              Choose a new password
            </a>
          </p>
          <p style="margin:0;font-size:12px;line-height:18px;color:#94a3b8;">
            If you did not ask to reset your password you can ignore this email.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
